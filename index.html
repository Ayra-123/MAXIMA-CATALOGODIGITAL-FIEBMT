<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo da Biblioteca — Grêmio Estudantil Máxima</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --amarelo:#FFC933; --amarelo-esc:#D99E00;
  --azul:#16305C; --azul-esc:#0D1F3D; --azul-med:#24478A; --azul-claro:#EAF0FA;
  --tinta:#1B2340; --tinta-suave:#6B7590;
  --creme:#FFFDF6; --card:#FFFFFF; --borda:#DDE3EF; --borda-esc:#C3CCDE;
  --verde:#2FAE72; --verde-esc:#1F8455;
  --coral:#FF6B4A; --coral-esc:#D64A2B;
  --dourado:#E8A917; --dourado-esc:#B8830F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--creme);font-family:'Inter',sans-serif;color:var(--tinta)}
#app{max-width:480px;margin:0 auto;padding:22px 18px 44px;min-height:100vh}
h1,h2,.display{font-family:'Baloo 2',sans-serif;margin:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:82vh;text-align:center}

label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta-suave);margin:0 0 7px}
input,select,textarea{width:100%;padding:14px 15px;font-size:16px;font-family:'Inter',sans-serif;font-weight:500;
  border:2px solid var(--borda);border-radius:14px;background:#fff;outline:none;color:var(--tinta)}
input:focus,select:focus,textarea:focus{border-color:var(--azul-med)}
.campo{margin-bottom:16px;text-align:left}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none}

/* botoes com relevo, estilo jogo */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;
  font-size:15px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
  border-radius:16px;background:var(--amarelo);color:var(--azul);
  box-shadow:0 4px 0 var(--amarelo-esc);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--amarelo-esc)}
.btn:disabled{opacity:.45;box-shadow:0 4px 0 var(--amarelo-esc);transform:none;cursor:not-allowed}
.btn-escuro{background:var(--azul);color:var(--amarelo);box-shadow:0 4px 0 var(--azul-esc)}
.btn-escuro:active{box-shadow:0 0 0 var(--azul-esc)}
.btn-vazado{background:#fff;color:var(--azul);border:2px solid var(--borda-esc);box-shadow:0 4px 0 var(--borda-esc)}
.btn-vazado:active{box-shadow:0 0 0 var(--borda-esc)}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-esc)}
.btn-coral:active{box-shadow:0 0 0 var(--coral-esc)}
.btn-verde{background:var(--verde);color:#fff;box-shadow:0 4px 0 var(--verde-esc)}
.btn-verde:active{box-shadow:0 0 0 var(--verde-esc)}
.link{display:block;width:100%;background:none;font-size:13px;font-weight:700;color:var(--azul-med);
  text-decoration:underline;margin-top:16px;padding:8px}

/* cartoes com relevo */
.card{background:var(--card);border:2px solid var(--borda);border-bottom-width:5px;border-radius:20px;
  padding:18px;margin-bottom:12px;width:100%;text-align:left;display:block;transition:transform .06s}
.card:active{transform:translateY(3px)}
.card-amarelo{background:var(--amarelo);border-color:var(--amarelo-esc)}
.card-azul{background:var(--azul);border-color:var(--azul-esc)}
.card-ranking{background:linear-gradient(135deg,#1D3D72 0%,#16305C 60%);border-color:var(--azul-esc)}
.card h2{font-size:19px;margin:0;color:var(--azul);display:flex;align-items:center;gap:9px}
.card-amarelo h2{color:var(--azul)}
.card-azul h2,.card-ranking h2{color:var(--amarelo)}
.card p{margin:3px 0 0 34px;font-size:13px;font-weight:500;color:var(--tinta-suave)}
.card-amarelo p{color:rgba(22,48,92,.8)}
.card-azul p,.card-ranking p{color:rgba(255,255,255,.78)}
.emoji{font-size:23px;line-height:1}

.topo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.topo h1{font-size:22px;flex:1;color:var(--azul)}
.voltar{background:#fff;border:2px solid var(--borda);border-bottom-width:4px;border-radius:14px;
  width:42px;height:42px;font-size:20px;line-height:1;color:var(--azul);font-weight:800}
.voltar:active{transform:translateY(2px);border-bottom-width:2px}

.selo-btn{width:100%;padding:16px;margin-bottom:9px;text-align:left;font-size:15px;font-weight:700;
  border-radius:14px;background:#fff;border:2px solid var(--borda);border-bottom-width:4px;color:var(--tinta)}
.selo-btn:active{transform:translateY(2px);border-bottom-width:2px}
.selo-btn.ativo{background:var(--azul);border-color:var(--azul-esc);color:#fff}

.tag{display:inline-block;font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px;
  background:var(--azul-claro);color:var(--azul);margin:0 6px 4px 0}
.tag-azul{background:var(--azul);color:var(--amarelo)}
.tag-amarela{background:var(--amarelo);color:var(--azul)}

.aviso{border-radius:16px;padding:15px;margin-bottom:18px;font-size:14px;font-weight:500;line-height:1.5;
  border-width:2px;border-style:solid;border-bottom-width:4px}
.aviso-coral{background:#FFE9E1;border-color:var(--coral)}
.aviso-amarelo{background:#FFF6DE;border-color:var(--amarelo-esc)}
.aviso-azul{background:var(--azul-claro);border-color:var(--azul-med)}

/* cartao grande do livro encontrado */
.livro-destaque{display:flex;gap:16px;background:#fff;border:2px solid var(--borda);border-bottom-width:5px;
  border-radius:20px;padding:16px;margin-bottom:18px;align-items:flex-start}
.capa-gg{width:104px;height:150px;object-fit:cover;border-radius:12px;flex-shrink:0;
  background:var(--azul-claro);border:2px solid var(--borda)}
.livro-destaque .tit{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;line-height:1.2;color:var(--azul)}
.livro-destaque .aut{font-size:14px;font-weight:600;color:var(--tinta);margin-top:4px}
.livro-destaque .det{font-size:13px;font-weight:500;color:var(--tinta-suave);margin-top:8px;line-height:1.5}
.livro-destaque .fonte{font-size:11px;font-weight:800;color:var(--verde);margin-top:9px;text-transform:uppercase;letter-spacing:.04em}

.livro{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--borda);
  border-bottom-width:4px;border-radius:16px;padding:12px;margin-bottom:10px}
.capa{width:56px;height:80px;object-fit:cover;border-radius:9px;flex-shrink:0;
  background:var(--azul-claro);border:1px solid var(--borda)}
.livro-info{flex:1;min-width:0}
.livro-info .t{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;line-height:1.25;color:var(--azul)}
.livro-info .a{font-size:12px;font-weight:500;color:var(--tinta-suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.icone-btn{background:var(--azul-claro);border:2px solid var(--borda);border-bottom-width:4px;border-radius:12px;
  width:40px;height:40px;flex-shrink:0;font-size:16px;color:var(--azul)}
.icone-btn:active{transform:translateY(2px);border-bottom-width:2px}
.lixeira{background:#FFE9E1;border-color:#FFC7B7;color:var(--coral)}

.linha{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--borda);
  border-bottom-width:4px;border-radius:14px;padding:13px 15px;margin-bottom:8px;width:100%;
  font-size:14px;font-weight:700;text-align:left;color:var(--tinta)}
.linha:active{transform:translateY(2px);border-bottom-width:2px}
.podio1{background:#FFF8E3;border-color:var(--amarelo-esc)}
.podio2{background:#F2F4F8;border-color:var(--borda-esc)}
.podio3{background:#FBEFE6;border-color:#D9A87E}
.medalha{font-size:19px;margin-right:8px}

.secao-tit{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  color:var(--azul-med);margin:28px 0 11px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.chip{flex-shrink:0;font-size:12px;font-weight:700;padding:9px 15px;border-radius:999px;background:#fff;
  border:2px solid var(--borda);color:var(--tinta-suave)}
.chip.ativo{background:var(--azul);border-color:var(--azul-esc);color:var(--amarelo)}
.erro{color:var(--coral);font-size:13px;font-weight:700;margin:-8px 0 12px;text-align:left}

.contagem{display:flex;justify-content:space-between;align-items:center;background:var(--azul);
  border-radius:18px;border-bottom:5px solid var(--azul-esc);padding:16px 20px;margin-bottom:20px}
.contagem span{color:#B9C7E0;font-weight:700;font-size:14px}
.contagem b{color:var(--amarelo);font-family:'Baloo 2',sans-serif;font-size:26px}

.barra{height:12px;background:var(--borda);border-radius:999px;overflow:hidden;margin-top:10px}
.barra i{display:block;height:100%;background:var(--amarelo);border-radius:999px}

.visor{position:relative}
#leitor{width:100%;border-radius:20px;overflow:hidden;background:var(--azul);margin-bottom:14px}
.flash-btn{position:absolute;top:12px;right:12px;z-index:5;width:48px;height:48px;border-radius:14px;
  background:rgba(255,255,255,.94);border:2px solid rgba(22,48,92,.15);border-bottom-width:4px;font-size:21px;
  line-height:1;display:none;align-items:center;justify-content:center;color:var(--azul)}
.flash-btn.ativo{background:var(--amarelo);border-color:var(--amarelo-esc)}

.vazio{text-align:center;color:var(--tinta-suave);font-size:14px;font-weight:500;padding:34px 0}
.check{display:flex;align-items:center;gap:10px;margin:-4px 0 16px;font-size:13px;font-weight:700;
  color:var(--tinta-suave);text-align:left}
.check input{width:20px;height:20px;flex-shrink:0}
.ok{width:84px;height:84px;border-radius:50%;background:var(--verde);color:#fff;font-size:42px;
  display:flex;align-items:center;justify-content:center;margin-bottom:18px;border-bottom:5px solid var(--verde-esc)}
.rodape{text-align:center;font-size:11px;font-weight:600;color:var(--tinta-suave);margin-top:30px;
  padding-top:16px;border-top:2px solid var(--borda)}

/* ---- elementos visuais da identidade do Grêmio ---- */
.ceu{position:relative}
.ceu .est{position:absolute;color:var(--amarelo);opacity:.5;pointer-events:none;line-height:1;
  text-shadow:0 0 8px rgba(255,201,51,.5)}
.num{position:absolute;top:14px;right:18px;font-family:'Baloo 2',sans-serif;font-weight:800;
  font-size:15px;letter-spacing:.06em;opacity:.32}
.card{position:relative}
.card .num{color:var(--azul)}
.card-azul .num,.card-ranking .num{color:var(--amarelo);opacity:.45}
.card-amarelo .num{color:var(--azul);opacity:.4}
.secao-tit::before{content:"\2605";margin-right:7px;color:var(--amarelo);font-size:13px}
.faixa{height:5px;border-radius:999px;margin:0 0 22px;
  background:linear-gradient(90deg,var(--amarelo) 0%,var(--dourado) 45%,var(--azul-med) 45%,var(--azul) 100%)}
.brasao{position:relative;display:inline-block}
.brasao::after{content:"\2605";position:absolute;top:-4px;right:-6px;font-size:20px;color:var(--amarelo);
  text-shadow:0 1px 3px rgba(0,0,0,.25)}
.logo{width:132px;height:132px;object-fit:contain;margin-bottom:14px;border-radius:26px;
  background:#fff;border:3px solid var(--borda);box-shadow:0 5px 0 var(--borda-esc)}
.logo-sm{width:46px;height:46px;object-fit:contain;border-radius:14px;background:#fff;
  border:2px solid var(--borda)}
.contagem{position:relative;overflow:hidden}
.contagem::after{content:"\2605\2605\2605";position:absolute;right:-6px;top:-10px;font-size:34px;
  color:rgba(255,201,51,.13);letter-spacing:-6px}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ CONFIGURAÇÃO — ajuste aqui antes do mutirão ============ */

/* --- BANCO DE DADOS (Supabase) --- */
var SUPABASE_URL = "https://xfudhlxmexedxwvzujae.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmdWRobHhtZXhlZHh3dnp1amFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MzMyMTksImV4cCI6MjEwMDUwOTIxOX0.Xahwaf8CS5IJYODq_ocsvZ38FLC7uTZO3eAiNzBfFzQ";
/* Enquanto a chave não for colada, o site funciona guardando os dados
   apenas no próprio celular. Com a chave, todos passam a ver o mesmo acervo. */

var SEM_CAPA = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
var LOGO = "chapamaximapreto.jpg";
var RM_DIGITOS = 5;
var COORDENADORAS = ["76063", "11111", "22222", "33333"];
/* Ayra = 76063 (dona) · Maíra = 11111 · Ana Clara = 22222 · Melissa = 33333 */
var RM_DONA = "76063";  /* só este RM vê o botão de zerar o catálogo */
/* Armários iniciais — as coordenadoras podem renomear, criar e apagar
   pelo próprio site, na tela Armários do painel. */
var ARMARIOS_PADRAO = [
  {id:"a1", codigo:"A1", nome:"Literatura", categorias:"Literatura", ordem:1},
  {id:"a2", codigo:"A2", nome:"Paradidáticos", categorias:"Paradidáticos", ordem:2},
  {id:"b1", codigo:"B1", nome:"PNLD", categorias:"PNLD", ordem:3},
  {id:"b2", codigo:"B2", nome:"Dicionários", categorias:"Dicionários", ordem:4},
  {id:"c1", codigo:"C1", nome:"Vestibulares", categorias:"Vestibulares", ordem:5},
  {id:"c2", codigo:"C2", nome:"Coleções", categorias:"Coleções", ordem:6},
  {id:"d1", codigo:"D1", nome:"Revistas", categorias:"Revistas", ordem:7},
  {id:"d2", codigo:"D2", nome:"Outros", categorias:"Outros gêneros", ordem:8}
];
var GENEROS = ["Literatura","Paradidáticos","Dicionários","Vestibulares","Coleções","Revistas","Outros gêneros"];
var CATEGORIAS_TODAS = ["PNLD"].concat(GENEROS);
var ESTADOS = ["Excelente","Bom","Regular","Ruim","Necessita reparo"];
var SELOS = ["PNLD","Acervo da Biblioteca","Comum"];
var COLECOES = [
  {id:"folclore", nome:"Folclore Brasileiro", chave:"folclore brasileiro"},
  {id:"vagalume", nome:"Vaga-Lume", chave:"vaga-lume"}
];
/* ==================================================================== */

var S = {tela:"login", user:null, livros:[], pendencias:[], logins:[], armarios:[], form:{}, erro:"",
         busca:"", filtro:"Todos", editando:null, dup:null, msg:"", rmVisto:null, carregando:false, offline:false, ultimoIsbn:"", msgArm:"", verTodasEntradas:false};

/* devolve todos os armários que aceitam a categoria informada */
function armariosDe(cat){
  if(!cat)return [];
  return S.armarios.filter(function(a){
    return (a.categorias||"").split(",").map(function(x){return x.trim();}).indexOf(cat)>=0;
  });
}

/* ---------- BANCO DE DADOS ---------- */
var db = null;
try{
  if(typeof window.supabase!=="undefined" && SUPABASE_KEY.indexOf("COLE_AQUI")<0){
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
}catch(e){ db=null; }

function salvar(){
  try{
    localStorage.setItem("cat_livros", JSON.stringify(S.livros));
    localStorage.setItem("cat_pend", JSON.stringify(S.pendencias));
    localStorage.setItem("cat_logins", JSON.stringify(S.logins));
  }catch(e){}
}
function carregar(){
  try{
    S.livros = JSON.parse(localStorage.getItem("cat_livros")||"[]");
    S.pendencias = JSON.parse(localStorage.getItem("cat_pend")||"[]");
    S.logins = JSON.parse(localStorage.getItem("cat_logins")||"[]");
  }catch(e){ S.livros=[]; S.pendencias=[]; S.logins=[]; }
  try{
    var arm=JSON.parse(localStorage.getItem("cat_armarios")||"null");
    S.armarios = (arm&&arm.length)? arm : ARMARIOS_PADRAO.slice();
  }catch(e){ S.armarios=ARMARIOS_PADRAO.slice(); }
  /* mantém a sessão se o celular bloquear ou a página recarregar */
  try{
    var u=JSON.parse(localStorage.getItem("cat_user")||"null");
    if(u&&u.rm&&u.nome){ S.user=u; S.tela="home"; }
  }catch(e){}
}

/* ---------- FILA DE ENVIO ----------
   Todo cadastro entra numa fila gravada no celular antes de ir ao banco.
   Se a internet cair, ele fica guardado e é reenviado sozinho quando voltar. */
function fila(){
  try{ return JSON.parse(localStorage.getItem("cat_fila")||"[]"); }catch(e){ return []; }
}
function gravarFila(f){
  try{ localStorage.setItem("cat_fila", JSON.stringify(f)); }catch(e){}
}
function presos(){
  try{ return JSON.parse(localStorage.getItem("cat_presos")||"[]"); }catch(e){ return []; }
}
function gravarPresos(p){
  try{ localStorage.setItem("cat_presos", JSON.stringify(p)); }catch(e){}
}
function enfileirar(tipo,dado){
  var f=fila(); f.push({tipo:tipo,dado:dado,recusas:0}); gravarFila(f);
}
var enviando=false;
function processarFila(){
  if(!db||enviando)return;
  var f=fila();
  if(!f.length){
    if(S.offline){S.offline=false;render();}
    return;
  }
  enviando=true;
  var item=f[0];
  var op = item.tipo==="livro"     ? db.from("livros").upsert(item.dado)
         : item.tipo==="pendencia" ? db.from("pendencias").upsert(item.dado)
         :                           db.from("logins").insert(item.dado);
  op.then(function(r){
    enviando=false;
    var g=fila();
    if(r&&r.error){
      /* o banco respondeu e recusou este item: o problema é ele, não a internet.
         depois de 3 recusas, tira da frente para não travar os outros. */
      if(g.length){
        g[0].recusas=(g[0].recusas||0)+1;
        g[0].erro=r.error.message||"recusado pelo banco";
        if(g[0].recusas>=3){
          var p=presos(); p.push(g.shift()); gravarPresos(p); gravarFila(g);
          S.offline=true; render(); processarFila(); return;
        }
        gravarFila(g);
      }
      S.offline=true; render(); return;
    }
    g.shift(); gravarFila(g);
    processarFila();
  }).catch(function(){
    /* nem chegou ao servidor: é internet. não conta como recusa do item. */
    enviando=false; S.offline=true; render();
  });
}
function tentarPresosDeNovo(){
  var p=presos();
  if(!p.length)return;
  var f=fila();
  for(var i=0;i<p.length;i++){ p[i].recusas=0; f.push(p[i]); }
  gravarFila(f); gravarPresos([]);
  processarFila(); render();
}
function descartarPresos(){
  var p=presos();
  if(!p.length)return;
  if(!confirm("Descartar "+p.length+" cadastro(s) que o banco recusou?\n\nEles não vão para o catálogo. Os livros terão que ser escaneados de novo."))return;
  gravarPresos([]); render();
}
function enviarLivro(l){ enfileirar("livro",l); processarFila(); }
function enviarPendencia(p){ enfileirar("pendencia",p); processarFila(); }
function enviarLogin(x){ enfileirar("login",x); processarFila(); }

/* ---------- LEITURA DO BANCO ----------
   Só rebaixa o catálogo a cada 15 segundos, para não puxar milhares
   de livros a cada toque de botão. */
var ultimaSync=0;
function baixarTudo(forcar){
  if(!db)return;
  var agora=Date.now();
  if(!forcar && agora-ultimaSync<15000) return;
  ultimaSync=agora;

  db.from("livros").select("*").order("criado_em",{ascending:false}).then(function(r){
    if(r.error){ S.offline=true; render(); return; }
    var vindos=r.data||[];
    /* mantém na tela os livros que ainda não subiram, para nada sumir */
    var temId={}; vindos.forEach(function(l){temId[l.id]=true;});
    fila().forEach(function(item){
      if(item.tipo==="livro" && !temId[item.dado.id]) vindos.unshift(item.dado);
    });
    S.livros=vindos; salvar(); render();
  });
  db.from("pendencias").select("*").then(function(r){
    if(!r.error){S.pendencias=r.data||[];salvar();render();}
  });
  db.from("logins").select("*").order("criado_em",{ascending:false}).limit(60).then(function(r){
    if(!r.error){S.logins=r.data||[];render();}
  });
  db.from("armarios").select("*").order("ordem",{ascending:true}).then(function(r){
    if(r.error)return;
    if(!r.data||!r.data.length){
      /* primeira vez: grava os armários iniciais no banco */
      S.armarios=ARMARIOS_PADRAO.slice();
      db.from("armarios").upsert(S.armarios).then(function(){});
    }else{
      S.armarios=r.data;
    }

function checarFlash(){

    .then(function(){

      if(b)b.className = flashLigado ? "flash-btn ativo" : "flash-btn";

function capitalizar(s){
  if(!s)return "";
  if(s!==s.toUpperCase())return s;
  return s.toLowerCase().replace(/(^|\s|['\u2019-])\S/g,function(c){return c.toUpperCase();});
}
function capaReserva(isbn){
  return "https://covers.openlibrary.org/b/isbn/"+isbn+"-M.jpg?default=false";
}
/* Procura uma capa melhor em segundo plano e encaixa na tela quando achar.
   Não redesenha o formulário, para não apagar o que a pessoa já preencheu. */
function trocarCapa(url){
  var img=document.getElementById("capaLivro");
  if(!img)return;
  var teste=new Image();
  teste.onload=function(){
    if(S.tela!=="formulario")return;

function buscarCapaEmSegundoPlano(isbn){
  fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:"+isbn)
    .then(function(r){return r.json();})
    .then(function(d){
      if(S.form.isbn!==isbn)return;
      var v=d.items&&d.items[0]&&d.items[0].volumeInfo;
      var lk=v&&v.imageLinks;
      if(lk){
        var u=(lk.thumbnail||lk.smallThumbnail||"").replace("http://","https://");
        if(u)trocarCapa(u.replace("&zoom=1","&zoom=2"));
      }
    })
    .catch(function(){});
}
function aplicarDados(isbn,dados){
  S.carregando=false;
  S.form=formVazio(); S.form.isbn=isbn;
  S.form.titulo=capitalizar(dados.titulo||"");
  S.form.autor=capitalizar(dados.autor||"");
  S.form.editora=capitalizar(dados.editora||"");
  S.form.ano=dados.ano||"";
  S.form.capa=dados.capa||null;
  S.form.autoPreenchido=true;
  ir("formulario");
  /* a tela já apareceu — agora procura uma capa melhor sem atrapalhar */
  if(!dados.capaDefinitiva)buscarCapaEmSegundoPlano(isbn);
}
function buscarIsbn(isbn){
  isbn=String(isbn).replace(/[^0-9Xx]/g,"");
  var existente=null;
  for(var i=0;i<S.livros.length;i++){if(S.livros[i].isbn===isbn){existente=S.livros[i];break;}}
  if(existente){S.dup=existente;return ir("duplicado");}
  S.carregando=true;S.ultimoIsbn=isbn;render();
  buscarBrasilAPI(isbn);
}

/* 1a fonte: BrasilAPI — reúne CBL, Mercado Editorial, Open Library e Google Books */
function buscarBrasilAPI(isbn){
  fetch("https://brasilapi.com.br/api/isbn/v1/"+isbn)
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(d){
      if(d&&d.title){
        var t=d.title;
        if(d.subtitle)t+=" — "+d.subtitle;
        return aplicarDados(isbn,{
          titulo:t,
          autor:(d.authors||[]).join(", "),
          editora:d.publisher||"",
          ano:d.year?String(d.year):"",
          capa:d.cover_url||capaReserva(isbn),
          capaDefinitiva:!!d.cover_url
        });
      }
      buscarGoogle(isbn);
    })
    .catch(function(){ buscarGoogle(isbn); });
}

/* 2a fonte: Google Books — cobre bem edição estrangeira */
function buscarGoogle(isbn){
  fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:"+isbn)
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.items&&d.items.length){
        var v=d.items[0].volumeInfo||{};
        var t=v.title||"";
        if(v.subtitle)t+=" — "+v.subtitle;
        return aplicarDados(isbn,{
          titulo:t,
          autor:(v.authors||[]).join(", "),
          editora:v.publisher||"",
          ano:(v.publishedDate||"").substring(0,4),
          capa:(v.imageLinks&&v.imageLinks.thumbnail)?v.imageLinks.thumbnail.replace("http://","https://"):capaReserva(isbn),
          capaDefinitiva:!!(v.imageLinks&&v.imageLinks.thumbnail)
        });
      }
      buscarOpenLibrary(isbn);
    })
    .catch(function(){ buscarOpenLibrary(isbn); });
}

/* 3a fonte: Open Library */
function buscarOpenLibrary(isbn){
  fetch("https://openlibrary.org/api/books?bibkeys=ISBN:"+isbn+"&format=json&jscmd=data")
    .then(function(r){return r.json();})
    .then(function(d){
      var k="ISBN:"+isbn, v=d[k];
      if(v&&v.title){
        var t=v.title;
        if(v.subtitle)t+=" — "+v.subtitle;
        return aplicarDados(isbn,{
          titulo:t,
          autor:(v.authors||[]).map(function(a){return a.name;}).join(", "),
          editora:(v.publishers||[]).map(function(p){return p.name;}).join(", "),
          ano:(v.publish_date||"").match(/\d{4}/)?(v.publish_date.match(/\d{4}/)[0]):"",
          capa:(v.cover&&(v.cover.medium||v.cover.large))?(v.cover.medium||v.cover.large):null
        });
      }
      S.carregando=false;S.form=formVazio();S.form.isbn=isbn;ir("naoAchou");
    })
    .catch(function(){
      S.carregando=false;S.form=formVazio();S.form.isbn=isbn;ir("naoAchou");});
}

function fotoEscolhida(input){
  var arq=input.files&&input.files[0];
  if(!arq)return;
  if(!db){alert("Precisa de internet para enviar a foto.");return;}
  var aviso=document.getElementById("statusCapa");
  if(aviso)aviso.textContent="Preparando a foto…";
  var leitor2=new FileReader();
  leitor2.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      /* reduz para no máximo 700px — foto de celular tem 4000px e pesaria demais */
      var max=700, w=img.width, h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; }
      else if(h>max){ w=Math.round(w*max/h); h=max; }
      var cv=document.createElement("canvas");
      cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cv.toBlob(function(blob){
        if(!blob){ if(aviso)aviso.textContent="Não consegui preparar a foto."; return; }
        if(aviso)aviso.textContent="Enviando…";
        var nome="capa_"+(S.form.isbn||"m")+"_"+Date.now()+".jpg";
        db.storage.from("capas").upload(nome,blob,{contentType:"image/jpeg",upsert:true}).then(function(r){
          if(r.error){
            if(aviso)aviso.textContent="Não consegui enviar. Tente de novo.";
            return;
          }
          var pub=db.storage.from("capas").getPublicUrl(nome);
          var url=pub&&pub.data?pub.data.publicUrl:null;
          if(!url){ if(aviso)aviso.textContent="Não consegui gerar o endereço da foto."; return; }
          S.form.capa=url;
          var el=document.getElementById("capaLivro");
          if(el){ el.src=url; el.style.visibility="visible"; el.style.display="block"; }
          if(aviso)aviso.textContent="Foto adicionada!";
        });
      },"image/jpeg",0.72);
    };
    img.onerror=function(){ if(aviso)aviso.textContent="Arquivo de imagem inválido."; };
    img.src=ev.target.result;
  };
  leitor2.readAsDataURL(arq);
}

function salvarLivro(){

  var orig=null;
  if(S.editando){for(var i=0;i<S.livros.length;i++){if(S.livros[i].id===S.editando)orig=S.livros[i];}}
  var novo={
    id: S.editando || f.isbn || ("m"+Date.now()),

    em: orig?orig.em:new Date().toLocaleString("pt-BR"),
    editadopor: orig?S.user.nome:null
  };
  if(S.editando){
    S.livros=S.livros.map(function(l){return l.id===S.editando?novo:l;});
    S.msg='"'+novo.titulo+'" foi atualizado.';
  }else{
    S.livros.unshift(novo);
    S.msg='"'+novo.titulo+'" foi catalogado no Armário '+novo.armario+'.';
    var col=null, tl=(novo.titulo||"").toLowerCase();
    for(var j=0;j<COLECOES.length;j++){if(tl.indexOf(COLECOES[j].chave)>=0)col=COLECOES[j];}
    if(col){
      var irmao=null;
      for(var k=0;k<S.livros.length;k++){
        if(S.livros[k].id!==novo.id && (S.livros[k].titulo||"").toLowerCase().indexOf(col.chave)>=0){irmao=S.livros[k];break;}}
      if(irmao){
        var pc={id:"p"+Date.now(),tipo:"colecao",livro:novo.id,rel:irmao.id,ok:false};

      S.pendencias.unshift(pd); enviarPendencia(pd);
      S.msg+=" A categoria ficou marcada para revisão.";

  }

}
function zerarTudo(){
  if(!S.user||S.user.rm!==RM_DONA)return;
  var frase=prompt("ATENÇÃO: isto apaga o catálogo INTEIRO — todos os livros de TODAS as pessoas, sem como desfazer.\n\nPara confirmar, digite: ZERAR");
  if(frase===null)return;
  if(frase.trim().toUpperCase()!=="ZERAR"){alert("Nada foi apagado.");return;}
  if(!confirm("Última confirmação: apagar "+S.livros.length+" livro(s) do catálogo?"))return;
  S.livros=[];S.pendencias=[];S.logins=[];
  gravarFila([]);
  gravarPresos([]);
  if(db){
    db.from("livros").delete().neq("id","").then(function(){});
    db.from("pendencias").delete().neq("id","").then(function(){});
    db.from("logins").delete().gt("id",0).then(function(){});
  }
  salvar();render();
}

function verHistorico(rm){S.rmVisto=rm;ir("histPessoa");}
function sair(){
  pararLeitor();
  try{ localStorage.removeItem("cat_user"); }catch(e){}
  S.user=null;S.form=formVazio();S.editando=null;ir("login");
}

      if(az.codigo){ if(vistos[az.codigo])repetidos.push(az.codigo); vistos[az.codigo]=true; }
    }
    if(semCod.length)h+='<div class="aviso aviso-coral" style="margin-top:12px;font-size:13px">Sem código: <b>'+esc(semCod.join(", "))+'</b>. Preencha o código, senão os livros ficam sem lugar.</div>';
    if(repetidos.length)h+='<div class="aviso aviso-coral" style="margin-top:12px;font-size:13px">Código repetido: <b>'+esc(repetidos.join(", "))+'</b>. Dois armários com o mesmo código confundem na hora de guardar.</div>';
    h+=rodape();
  }

  else if(S.tela==="painel"){
    h=cabecalho("Painel da coordenação","home");
    var pa=pendAbertas();
    h+='<div class="secao-tit">Pendências ('+pa.length+')</div>';
    if(!pa.length)h+='<p style="font-size:14px;color:var(--tinta-suave)">Nenhuma pendência no momento.</p>';
    for(var i=0;i<pa.length;i++){
      var p=pa[i], lv=null, rl=null;
      for(var x=0;x<S.livros.length;x++){
        if(S.livros[x].id===p.livro)lv=S.livros[x];
        if(p.rel&&S.livros[x].id===p.rel)rl=S.livros[x];}
      var rot={duplicata:"Exemplar duplicado",colecao:"Possível mesma coleção",duvida:"Dúvida de categoria"}[p.tipo];
      var difere = rl && lv && rl.armario!==lv.armario;
      h+='<div class="aviso aviso-amarelo"><b style="font-size:12px">'+rot+'</b>'+
        '<div style="font-weight:600;margin-top:4px">'+esc(lv?lv.titulo:"—")+'</div>'+
        '<div style="font-size:12px;color:var(--tinta-suave)">Armário '+esc(lv?lv.armario:"—")+
        (p.tipo==="duvida"&&lv?' · catalogado como '+esc(lv.categoria):'')+'</div>'+
        (rl?'<div style="font-size:12px;color:var(--tinta-suave);margin-top:4px">com: '+esc(rl.titulo)+
            '<br><b style="color:'+(difere?'var(--coral)':'var(--tinta-suave)')+'">Armário '+esc(rl.armario)+
            (difere?' — armários diferentes, confira antes de unir':'')+'</b></div>':'')+
        '<button class="btn btn-escuro" style="margin-top:10px;padding:11px;font-size:13px" onclick="resolver(\''+p.id+'\')">'+
        (p.tipo==="duvida"?"Marcar como revisado":"Confirmar união física")+'</button></div>';
    }
    var rank=calcularRanking();
    h+='<div class="secao-tit">Ranking de catalogação</div>';
    if(!rank.length)h+='<p style="font-size:14px;color:var(--tinta-suave)">Ninguém catalogou ainda.</p>';
    for(var r=0;r<rank.length;r++){ h+=linhaRanking(rank[r],r,true); }

    h+='<div class="secao-tit">Entradas de hoje ('+S.logins.length+')</div>';
    if(!S.logins.length)h+='<p style="font-size:14px;color:var(--tinta-suave)">Ninguém entrou ainda.</p>';
    var limite = S.verTodasEntradas ? S.logins.length : 5;
    for(var g=0;g<S.logins.length && g<limite;g++){
      h+='<div class="linha"><span>'+esc(S.logins[g].nome)+' <span style="font-weight:500;color:var(--tinta-suave)">· RM '+esc(S.logins[g].rm)+'</span></span>'+
        '<span style="font-weight:700;color:var(--tinta-suave)">'+esc(S.logins[g].hora)+'</span></div>';
    }
    if(S.logins.length>5){
      h+='<button class="link" onclick="S.verTodasEntradas=!S.verTodasEntradas;render()">'+
         (S.verTodasEntradas?'Mostrar só as 5 últimas':'Ver todas as '+S.logins.length+' entradas')+'</button>';
    }
    h+='<div class="secao-tit">Organização</div>'+
      '<button class="btn btn-vazado" style="margin-bottom:10px" onclick="ir(\'armarios\')">Armários — definir códigos e o que cada um guarda</button>'+
      '<button class="btn btn-vazado" onclick="cadastroManual()">Cadastrar livro manualmente</button>'+
      (S.user.rm===RM_DONA?
        '<div class="secao-tit" style="color:var(--coral)">Antes do mutirão começar</div>'+
        '<p style="font-size:13px;color:var(--tinta-suave);margin:0 0 10px">Apaga o catálogo inteiro, de todas as pessoas. Use só para limpar os testes antes do dia.</p>'+
        '<button class="btn btn-coral" onclick="zerarTudo()">Zerar catálogo</button>' : '')+rodape();
  }

  document.getElementById("app").innerHTML=h;
}

function filtrar(){
  var b=S.busca.toLowerCase();
  return S.livros.filter(function(l){
    var bateB=!b||(l.titulo||"").toLowerCase().indexOf(b)>=0||(l.autor||"").toLowerCase().indexOf(b)>=0;
    var bateC=S.filtro==="Todos"||l.categoria===S.filtro;
    return bateB&&bateC;});
}
function desenhaLista(){
  var lista=filtrar();
  var el=document.getElementById("lista");
  if(el)el.innerHTML=lista.length?lista.map(function(l){return cardLivro(l,S.user&&S.user.papel==="coordenador");}).join(""):'<div class="vazio">Nenhum livro encontrado.</div>';
  var ct=document.getElementById("contador");
  if(ct)ct.textContent=lista.length+" de "+S.livros.length+" livros";
}

carregar();
render();
if(S.user)baixarTudo(true);

/* tenta reenviar o que ficou na fila, sozinho */
setInterval(processarFila, 12000);
window.addEventListener("online", processarFila);
processarFila();
</script>
</body>
</html>
