<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo da Biblioteca — Grêmio Estudantil Máxima</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --amarelo:#FFC933; --amarelo-esc:#F0AE00; --tinta:#211D33; --tinta-suave:#5B5674;
  --creme:#FFFCF4; --card:#FFFFFF; --borda:#EDE4C8; --verde:#2FAE72; --coral:#FF6B4A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--creme);font-family:'Inter',sans-serif;color:var(--tinta)}
#app{max-width:480px;margin:0 auto;padding:24px 20px 48px;min-height:100vh}
h1,h2,.display{font-family:'Baloo 2',sans-serif;margin:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:85vh;text-align:center}
.logo{width:120px;height:120px;object-fit:contain;margin-bottom:16px}
.logo-sm{width:48px;height:48px;object-fit:contain;border-radius:50%}
label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--tinta-suave);margin:0 0 6px}
input,select,textarea{width:100%;padding:13px 15px;font-size:16px;font-family:'Inter',sans-serif;border:2px solid var(--borda);border-radius:12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amarelo-esc)}
.campo{margin-bottom:16px;text-align:left}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;font-size:16px;font-weight:700;border-radius:16px;background:var(--amarelo);color:var(--tinta)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-escuro{background:var(--tinta);color:var(--amarelo)}
.btn-vazado{background:#fff;color:var(--tinta);border:2px solid var(--borda)}
.btn-coral{background:var(--coral);color:#fff}
.link{display:block;width:100%;background:none;font-size:13px;font-weight:600;color:var(--tinta-suave);text-decoration:underline;margin-top:14px;padding:6px}
.card{background:var(--card);border:2px solid var(--borda);border-radius:20px;padding:20px;margin-bottom:12px;width:100%;text-align:left;display:block}
.card-amarelo{background:var(--amarelo);border-color:var(--amarelo)}
.card-escuro{background:var(--tinta);border-color:var(--tinta);color:var(--amarelo)}
.card h2{font-size:18px;margin:8px 0 2px}
.card p{margin:0;font-size:13px;color:var(--tinta-suave)}
.card-amarelo p{color:rgba(33,29,51,.75)}
.card-escuro p{color:#C9C5DA}
.topo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.topo h1{font-size:21px;flex:1}
.voltar{background:#fff;border:1.5px solid var(--borda);border-radius:50%;width:38px;height:38px;font-size:20px;line-height:1;color:var(--tinta)}
.selo-btn{width:100%;padding:15px;margin-bottom:8px;text-align:left;font-size:15px;font-weight:700;border-radius:12px;background:#fff;border:2px solid var(--borda);color:var(--tinta)}
.selo-btn.ativo{background:var(--tinta);border-color:var(--tinta);color:var(--amarelo)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--amarelo);color:var(--tinta);margin-right:6px}
.tag-escura{background:var(--tinta);color:var(--amarelo)}
.aviso{border-radius:16px;padding:14px;margin-bottom:18px;font-size:14px;font-weight:500;line-height:1.5}
.aviso-coral{background:#FFE9E1;border:1.5px solid var(--coral)}
.aviso-amarelo{background:#FFF3D6;border:1.5px solid var(--amarelo-esc)}
.livro{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--borda);border-radius:16px;padding:12px;margin-bottom:10px}
.capa{width:52px;height:74px;object-fit:cover;border-radius:8px;flex-shrink:0;background:var(--creme)}
.livro-info{flex:1;min-width:0}
.livro-info .t{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.livro-info .a{font-size:12px;color:var(--tinta-suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icone-btn{background:var(--creme);border:1.5px solid var(--borda);border-radius:50%;width:36px;height:36px;flex-shrink:0;font-size:15px}
.linha{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1.5px solid var(--borda);border-radius:12px;padding:11px 14px;margin-bottom:6px;width:100%;font-size:14px;font-weight:600;text-align:left;color:var(--tinta)}
.secao-tit{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta-suave);margin:26px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.chip{flex-shrink:0;font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--borda);color:var(--tinta-suave)}
.chip.ativo{background:var(--tinta);border-color:var(--tinta);color:var(--amarelo)}
.erro{color:var(--coral);font-size:13px;font-weight:600;margin:-8px 0 12px}
.contagem{display:flex;justify-content:space-between;align-items:center;background:var(--tinta);border-radius:16px;padding:14px 18px;margin-bottom:22px}
.contagem span{color:var(--amarelo);font-weight:600;font-size:14px}
.contagem b{color:var(--amarelo);font-family:'Baloo 2',sans-serif;font-size:22px}
#leitor{width:100%;border-radius:20px;overflow:hidden;background:var(--tinta);margin-bottom:14px}
.vazio{text-align:center;color:var(--tinta-suave);font-size:14px;padding:32px 0}
.check{display:flex;align-items:center;gap:9px;margin:-6px 0 16px;font-size:13px;font-weight:600;color:var(--tinta-suave)}
.check input{width:18px;height:18px;flex-shrink:0}
.ok{width:72px;height:72px;border-radius:50%;background:var(--verde);color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
/* ====== CONFIGURAÇÃO — ajuste aqui antes do mutirão ====== */
var LOGO = "chapamaximapreto.jpg";
var RM_DIGITOS = 5;
var COORDENADORAS = ["11111", "22222", "33333"];
  var ARMARIOS = [
  {codigo:"A1", categoria:"Literatura"},
  {codigo:"A2", categoria:"Paradidáticos"},
  {codigo:"B1", categoria:"PNLD"},
  {codigo:"B2", categoria:"Dicionários"},
  {codigo:"C1", categoria:"Vestibulares"},
  {codigo:"C2", categoria:"Coleções"},
  {codigo:"D1", categoria:"Revistas"},
  {codigo:"D2", categoria:"Outros gêneros"}
];
var GENEROS = ["Literatura","Paradidáticos","Dicionários","Vestibulares","Coleções","Revistas","Outros gêneros"];
var ESTADOS = ["Excelente","Bom","Regular","Ruim","Necessita reparo"];
var SELOS = ["PNLD","Acervo da Biblioteca","Comum"];
var COLECOES = [
  {id:"folclore", nome:"Folclore Brasileiro", chave:"folclore brasileiro"},
  {id:"vagalume", nome:"Vaga-Lume", chave:"vaga-lume"}
];
/* ========================================================= */

var S = {tela:"login", user:null, livros:[], pendencias:[], logins:[], form:{}, erro:"",
         busca:"", filtro:"Todos", editando:null, dup:null, msg:"", rmVisto:null, carregando:false};

function salvar(){
  try{
    localStorage.setItem("cat_livros", JSON.stringify(S.livros));
    localStorage.setItem("cat_pend", JSON.stringify(S.pendencias));
    localStorage.setItem("cat_logins", JSON.stringify(S.logins));
  }catch(e){}
}
function carregar(){
  try{
    S.livros = JSON.parse(localStorage.getItem("cat_livros")||"[]");
    S.pendencias = JSON.parse(localStorage.getItem("cat_pend")||"[]");
    S.logins = JSON.parse(localStorage.getItem("cat_logins")||"[]");
  }catch(e){}
}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function armarioDe(cat){for(var i=0;i<ARMARIOS.length;i++){if(ARMARIOS[i].categoria===cat)return ARMARIOS[i];}return null;}
function formVazio(){return {titulo:"",autor:"",editora:"",ano:"",isbn:null,capa:null,selo:"",categoria:"",duvida:false,estado:"",qtd:1,obs:"",autoPreenchido:false};}
function meusLivros(){return S.livros.filter(function(l){return l.rm===S.user.rm;});}
function hoje(){return meusLivros().length;}
function pendAbertas(){return S.pendencias.filter(function(p){return !p.ok;});}
function ir(t){S.tela=t;S.erro="";render();}

/* ---------- LOGIN ---------- */
function entrar(){
  var nome=(document.getElementById("nome").value||"").trim();
  var rm=(document.getElementById("rm").value||"").trim();
  if(nome.length<2){S.erro="Digite seu nome completo.";return render();}
  if(!/^\d+$/.test(rm)||rm.length!==RM_DIGITOS){
    S.erro="Digite somente os números do seu RM ("+RM_DIGITOS+" dígitos).";return render();}
  var papel = COORDENADORAS.indexOf(rm)>=0 ? "coordenador" : "voluntario";
  S.user={nome:nome, rm:rm, papel:papel};
  S.logins.unshift({nome:nome, rm:rm, papel:papel,
    hora:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})});
  salvar(); ir("home");
}
function demo(){document.getElementById("nome").value="Coordenadora Demo";document.getElementById("rm").value=COORDENADORAS[0];}

/* ---------- ISBN ---------- */
var leitor=null;
function pararLeitor(){
  if(leitor){try{leitor.stop().catch(function(){});}catch(e){}leitor=null;}
}
function abrirCamera(){
  if(typeof Html5Qrcode==="undefined"){alert("Leitor de código não carregou. Use o campo de digitar o ISBN.");return;}
  pararLeitor();
  leitor=new Html5Qrcode("leitor");
  leitor.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:140}},
    function(txt){pararLeitor();buscarIsbn(txt);},
    function(){}
  ).catch(function(){alert("Não foi possível abrir a câmera. Verifique a permissão do navegador ou digite o ISBN.");});
}
function buscarManual(){
  var v=(document.getElementById("isbnManual").value||"").replace(/\D/g,"");
  if(v)buscarIsbn(v);
}
function buscarIsbn(isbn){
  isbn=String(isbn).replace(/\D/g,"");
  var existente=null;
  for(var i=0;i<S.livros.length;i++){if(S.livros[i].isbn===isbn){existente=S.livros[i];break;}}
  if(existente){S.dup=existente;return ir("duplicado");}
  S.carregando=true;render();
  fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:"+isbn)
    .then(function(r){return r.json();})
    .then(function(d){
      S.carregando=false;
      S.form=formVazio(); S.form.isbn=isbn;
      if(d.items&&d.items.length){
        var v=d.items[0].volumeInfo||{};
        S.form.titulo=v.title||"";
        if(v.subtitle)S.form.titulo+=" — "+v.subtitle;
        S.form.autor=(v.authors||[]).join(", ");
        S.form.editora=v.publisher||"";
        S.form.ano=(v.publishedDate||"").substring(0,4);
        if(v.imageLinks&&v.imageLinks.thumbnail)S.form.capa=v.imageLinks.thumbnail.replace("http://","https://");
        S.form.autoPreenchido=true;
        ir("formulario");
      }else{ ir("naoAchou"); }
    })
    .catch(function(){S.carregando=false;S.form=formVazio();S.form.isbn=isbn;ir("naoAchou");});
}

/* ---------- FORM ---------- */
function setSelo(s){S.form.selo=s;render();}
function lerForm(){
  var g=function(id){var e=document.getElementById(id);return e?e.value:"";};
  if(document.getElementById("f_titulo"))S.form.titulo=g("f_titulo");
  if(document.getElementById("f_autor"))S.form.autor=g("f_autor");
  if(document.getElementById("f_cat"))S.form.categoria=g("f_cat");
  if(document.getElementById("f_est"))S.form.estado=g("f_est");
  if(document.getElementById("f_obs"))S.form.obs=g("f_obs");
  var d=document.getElementById("f_duvida");if(d)S.form.duvida=d.checked;
}
function mudaQtd(n){lerForm();S.form.qtd=Math.max(1,(S.form.qtd||1)+n);render();}
function atualizaForm(){lerForm();render();}
function salvarLivro(){
  lerForm();
  var f=S.form;
  var cat = f.selo==="PNLD" ? "PNLD" : f.categoria;
  var arm = armarioDe(cat);
  var novo={
    id: S.editando || f.isbn || ("m"+Date.now()),
    isbn: f.isbn||null, titulo:f.titulo, autor:f.autor, editora:f.editora, ano:f.ano,
    capa:f.capa||null, selo:f.selo, categoria:cat, armario:arm?arm.codigo:"—",
    estado:f.estado, qtd:f.qtd||1, obs:f.obs, colecao:null,
    nome:S.user.nome, rm:S.user.rm,
    em:new Date().toLocaleString("pt-BR")
  };
  if(S.editando){
    var orig=null;
    for(var i=0;i<S.livros.length;i++){if(S.livros[i].id===S.editando)orig=S.livros[i];}
    if(orig){novo.nome=orig.nome;novo.rm=orig.rm;novo.colecao=orig.colecao;novo.em=orig.em;
             novo.editadoPor=S.user.nome;}
    S.livros=S.livros.map(function(l){return l.id===S.editando?novo:l;});
    S.msg='"'+novo.titulo+'" foi atualizado.';
  }else{
    S.livros.unshift(novo);
    S.msg='"'+novo.titulo+'" foi catalogado no Armário '+novo.armario+'.';
    var col=null, t=(novo.titulo||"").toLowerCase();
    for(var j=0;j<COLECOES.length;j++){if(t.indexOf(COLECOES[j].chave)>=0)col=COLECOES[j];}
    if(col){
      var irmao=null;
      for(var k=0;k<S.livros.length;k++){
        if(S.livros[k].id!==novo.id && (S.livros[k].titulo||"").toLowerCase().indexOf(col.chave)>=0)irmao=S.livros[k];}
      if(irmao){
        S.pendencias.unshift({id:"p"+Date.now(),tipo:"colecao",livro:novo.id,rel:irmao.id,ok:false});
        S.msg+=' Pode ser da mesma coleção de "'+irmao.titulo+'" — chame um coordenador.';
      }
    }
    if(novo.duvida||S.form.duvida){
      S.pendencias.unshift({id:"pd"+Date.now(),tipo:"duvida",livro:novo.id,rel:null,ok:false});
      S.msg+=" A categoria ficou marcada para revisão.";
    }
  }
  S.editando=null;S.form=formVazio();salvar();ir("confirmado");
}
function editar(id){
  var l=null;for(var i=0;i<S.livros.length;i++){if(S.livros[i].id===id)l=S.livros[i];}
  if(!l)return;
  S.editando=id;
  S.form={titulo:l.titulo,autor:l.autor,editora:l.editora,ano:l.ano,isbn:l.isbn,capa:l.capa,
          selo:l.selo||"Acervo da Biblioteca",categoria:l.categoria,duvida:false,
          estado:l.estado,qtd:l.qtd,obs:l.obs,autoPreenchido:!!l.capa};
  ir("formulario");
}
function avisarCoord(){
  S.pendencias.unshift({id:"p"+Date.now(),tipo:"duplicata",livro:S.dup.id,rel:null,ok:false});
  S.msg='Aviso enviado. A coordenação vai unir este exemplar com "'+S.dup.titulo+'".';
  S.dup=null;salvar();ir("confirmado");
}
function resolver(pid){
  var p=null;for(var i=0;i<S.pendencias.length;i++){if(S.pendencias[i].id===pid)p=S.pendencias[i];}
  if(!p)return;
  if(p.tipo==="duplicata"){
    S.livros=S.livros.map(function(l){return l.id===p.livro?Object.assign({},l,{qtd:(l.qtd||1)+1}):l;});
  }else if(p.tipo==="colecao"){
    var cid="c"+Date.now();
    S.livros=S.livros.map(function(l){return (l.id===p.livro||l.id===p.rel)?Object.assign({},l,{colecao:cid}):l;});
  }
  p.ok=true;salvar();render();
}
function cadastroManual(){S.editando=null;S.form=formVazio();ir("formulario");}
function verHistorico(rm){S.rmVisto=rm;ir("histPessoa");}
function sair(){S.user=null;pararLeitor();ir("login");}

/* ---------- RENDER ---------- */
function cabecalho(titulo,voltarPara){
  return '<div class="topo">'+
    (voltarPara?'<button class="voltar" onclick="ir(\''+voltarPara+'\')">&#8249;</button>':'')+
    '<h1>'+esc(titulo)+'</h1></div>';
}
function cardLivro(l,comEditar){
  return '<div class="livro">'+
    (l.capa?'<img class="capa" src="'+esc(l.capa)+'" alt="">':'<div class="capa"></div>')+
    '<div class="livro-info"><div class="t">'+esc(l.titulo)+'</div>'+
    '<div class="a">'+esc(l.autor||"")+'</div>'+
    '<div style="margin-top:6px"><span class="tag">'+esc(l.categoria)+'</span>'+
    (l.colecao?'<span class="tag tag-escura">coleção</span>':'')+
    '<span style="font-size:11px;font-weight:600;color:var(--tinta-suave)">'+l.qtd+' exemplar(es)</span></div>'+
    '<div style="font-size:11px;font-weight:600;margin-top:4px">Armário '+esc(l.armario)+'</div></div>'+
    (comEditar?'<button class="icone-btn" onclick="editar(\''+l.id+'\')">&#9998;</button>':'')+
    '</div>';
}

function render(){
  var h="";
  if(S.tela!=="scan")pararLeitor();

  if(S.tela==="login"){
    h='<div class="center"><img class="logo" src="'+LOGO+'" alt="" onerror="this.style.display=\'none\'">'+
      '<h1 style="font-size:24px">Catálogo da Biblioteca</h1>'+
      '<p style="font-size:13px;color:var(--tinta-suave);margin:4px 0 26px">Grêmio Estudantil Máxima · Mutirão de catalogação</p>'+
      '<div style="width:100%">'+
      '<div class="campo"><label>Seu nome</label><input id="nome" placeholder="Ex: Maria Silva"></div>'+
      '<div class="campo"><label>RM</label><input id="rm" inputmode="numeric" maxlength="'+RM_DIGITOS+'" placeholder="'+RM_DIGITOS+' dígitos"></div>'+
      (S.erro?'<div class="erro">'+esc(S.erro)+'</div>':'')+
      '<button class="btn" onclick="entrar()">Entrar e começar a catalogar</button>'+
      '<button class="link" onclick="demo()">Preencher como coordenadora (demonstração)</button>'+
      '</div></div>';
  }

  else if(S.tela==="home"){
    h='<div class="topo"><img class="logo-sm" src="'+LOGO+'" alt="" onerror="this.style.display=\'none\'">'+
      '<div style="flex:1"><p style="font-size:12px;color:var(--tinta-suave);margin:0">Bem-vindo(a),</p>'+
      '<div class="display" style="font-size:18px;font-weight:700">'+esc(S.user.nome.split(" ")[0])+'</div></div>'+
      (S.user.papel==="coordenador"?'<span class="tag tag-escura">Coordenadora</span>':'')+'</div>'+
      '<div class="contagem"><span>Catalogados por você</span><b>'+hoje()+'</b></div>'+
      '<button class="card card-amarelo" onclick="ir(\'scan\')"><h2>Escanear livro</h2>'+
      '<p>Aponte a câmera para o código de barras</p></button>'+
      '<button class="card" onclick="ir(\'historico\')"><h2>Meu histórico</h2>'+
      '<p>'+meusLivros().length+' livros · editar</p></button>'+
      '<button class="card" onclick="ir(\'acervo\')"><h2>Acervo catalogado</h2>'+
      '<p>'+S.livros.length+' livros no total · buscar e filtrar</p></button>'+
      (S.user.papel==="coordenador"?
      '<button class="card card-escuro" onclick="ir(\'painel\')"><h2>Painel da coordenação</h2>'+
      '<p>'+pendAbertas().length+' pendência(s) · '+S.logins.length+' entradas</p></button>':'')+
      '<button class="link" onclick="sair()">Sair</button>';
  }

  else if(S.tela==="scan"){
    h=cabecalho("Escanear livro","home")+
      '<div id="leitor"></div>'+
      (S.carregando?'<p style="text-align:center;font-weight:600">Buscando dados do livro…</p>':'')+
      '<button class="btn" onclick="abrirCamera()">Abrir câmera</button>'+
      '<div class="campo" style="margin-top:20px"><label>ou digite o ISBN</label>'+
      '<div style="display:flex;gap:8px"><input id="isbnManual" inputmode="numeric" placeholder="978...">'+
      '<button class="btn btn-escuro" style="width:auto;padding:0 20px" onclick="buscarManual()">Buscar</button></div></div>'+
      '<button class="link" onclick="ir(\'semIsbn\')">Este livro não tem código de barras</button>';
  }

  else if(S.tela==="duplicado"){
    h=cabecalho("Livro já catalogado","scan")+
      '<div class="aviso aviso-coral">Atenção! Chame um coordenador ou fale com o líder da sua equipe — este livro já está catalogado.</div>'+
      cardLivro(S.dup,false)+
      '<p style="font-size:12px;color:var(--tinta-suave);margin:14px 0 18px">A coordenadora confirma a união pelo painel dela. Você não precisa fazer mais nada aqui.</p>'+
      '<button class="btn btn-coral" onclick="avisarCoord()">Entendi, avisar a coordenação</button>';
  }

  else if(S.tela==="naoAchou"){
    h=cabecalho("ISBN não encontrado","scan")+
      '<div class="aviso aviso-amarelo">Não achamos esse ISBN na base pública. '+
      (S.user.papel==="coordenador"?'Como você é coordenadora, pode cadastrar manualmente abaixo.'
        :'Separe o livro e chame um coordenador ou o líder da sua equipe.')+'</div>'+
      (S.user.papel==="coordenador"
        ?'<button class="btn" onclick="ir(\'formulario\')">Cadastrar manualmente</button>'
        :'<button class="btn btn-vazado" onclick="ir(\'scan\')">Voltar e separar o livro</button>');
  }

  else if(S.tela==="semIsbn"){
    h=cabecalho("Livro sem código de barras","scan")+
      '<div class="aviso aviso-amarelo">'+
      (S.user.papel==="coordenador"?'Cadastro manual liberado para coordenadoras.'
        :'Separe este livro e chame um coordenador ou o líder da sua equipe para cadastrar depois.')+'</div>'+
      (S.user.papel==="coordenador"
        ?'<button class="btn" onclick="cadastroManual()">Cadastrar manualmente</button>'
        :'<button class="btn btn-vazado" onclick="ir(\'scan\')">Voltar e separar o livro</button>');
  }

  else if(S.tela==="formulario"){
    var f=S.form;
    var cat = f.selo==="PNLD" ? "PNLD" : f.categoria;
    var arm = armarioDe(cat);
    h=cabecalho(S.editando?"Editar livro":"Completar cadastro","scan");
    if(f.autoPreenchido){
      h+='<div class="livro" style="align-items:flex-start">'+
        (f.capa?'<img class="capa" style="width:72px;height:100px" src="'+esc(f.capa)+'" alt="">':'')+
        '<div class="livro-info"><div class="display" style="font-size:17px;font-weight:700;white-space:normal">'+esc(f.titulo)+'</div>'+
        '<div class="a" style="white-space:normal">'+esc(f.autor)+'</div>'+
        '<div style="font-size:11px;color:var(--tinta-suave);margin-top:3px">'+esc(f.editora)+' · '+esc(f.ano)+'</div>'+
        '<div style="font-size:11px;font-weight:700;color:var(--verde);margin-top:6px">Preenchido automaticamente</div></div></div>';
    }else{
      h+='<div class="campo"><label>Título</label><input id="f_titulo" value="'+esc(f.titulo)+'"></div>'+
         '<div class="campo"><label>Autor</label><input id="f_autor" value="'+esc(f.autor)+'"></div>';
    }
    h+='<div class="campo"><label>Este livro tem carimbo de:</label>';
    for(var i=0;i<SELOS.length;i++){
      h+='<button class="selo-btn'+(f.selo===SELOS[i]?' ativo':'')+'" onclick="setSelo(\''+SELOS[i]+'\')">'+SELOS[i]+'</button>';
    }
    h+='</div>';
    if(f.selo && f.selo!=="PNLD"){
      h+='<div class="campo"><label>Categoria / gênero</label><select id="f_cat" onchange="atualizaForm()">'+
        '<option value="">Selecione</option>';
      for(var j=0;j<GENEROS.length;j++){
        h+='<option'+(f.categoria===GENEROS[j]?' selected':'')+'>'+GENEROS[j]+'</option>';}
      h+='</select></div>'+
        '<label class="check"><input type="checkbox" id="f_duvida"'+(f.duvida?' checked':'')+'>'+
        'Não tenho certeza — marcar para um professor revisar</label>';
    }
    if(arm){h+='<div style="margin-bottom:16px"><span class="tag'+(cat==="PNLD"?' tag-escura':'')+'">Vai para o Armário '+arm.codigo+' ('+arm.categoria+')</span></div>';}
    h+='<div class="campo"><label>Estado de conservação</label><select id="f_est" onchange="atualizaForm()"><option value="">Selecione</option>';
    for(var k=0;k<ESTADOS.length;k++){h+='<option'+(f.estado===ESTADOS[k]?' selected':'')+'>'+ESTADOS[k]+'</option>';}
    h+='</select></div>'+
      '<div class="campo"><label>Exemplares iguais encontrados juntos</label>'+
      '<div style="display:flex;align-items:center;gap:14px">'+
      '<button class="icone-btn" onclick="mudaQtd(-1)">&minus;</button>'+
      '<b class="display" style="font-size:19px">'+(f.qtd||1)+'</b>'+
      '<button class="icone-btn" onclick="mudaQtd(1)">+</button></div></div>'+
      '<div class="campo"><label>Observações (opcional)</label><textarea id="f_obs" rows="2">'+esc(f.obs)+'</textarea></div>';
    var pronto = f.titulo && f.selo && (f.selo==="PNLD"||f.categoria) && f.estado;
    h+='<button class="btn" onclick="salvarLivro()"'+(pronto?'':' disabled')+'>'+(S.editando?"Salvar alterações":"Salvar")+'</button>';
  }

  else if(S.tela==="confirmado"){
    h='<div class="center"><div class="ok">&#10003;</div>'+
      '<h1 style="font-size:23px">Feito!</h1>'+
      '<p style="font-size:14px;color:var(--tinta-suave);margin:8px 0 22px">'+esc(S.msg)+'</p>'+
      '<div class="contagem" style="width:100%"><span>Catalogados por você</span><b>'+hoje()+'</b></div>'+
      '<button class="btn" onclick="ir(\'scan\')">Escanear próximo</button>'+
      '<button class="link" onclick="ir(\'home\')">Voltar para o início</button></div>';
  }

  else if(S.tela==="historico"){
    var m=meusLivros();
    h=cabecalho("Meu histórico","home");
    h+= m.length? m.map(function(l){return cardLivro(l,true);}).join("")
      : '<div class="vazio">Você ainda não catalogou nenhum livro.</div>';
  }

  else if(S.tela==="histPessoa"){
    var lp=S.livros.filter(function(l){return l.rm===S.rmVisto;});
    h=cabecalho(lp.length?lp[0].nome:"Histórico","painel")+
      '<p style="font-size:12px;font-weight:600;color:var(--tinta-suave);margin:-10px 0 16px">RM '+esc(S.rmVisto)+' · '+lp.length+' livros</p>';
    h+= lp.length? lp.map(function(l){return cardLivro(l,true);}).join("")
      : '<div class="vazio">Nenhum livro encontrado.</div>';
  }

  else if(S.tela==="acervo"){
    var cats=["Todos"].concat(GENEROS).concat(["PNLD"]);
    var lista=S.livros.filter(function(l){
      var b=S.busca.toLowerCase();
      var bateB = !b || (l.titulo||"").toLowerCase().indexOf(b)>=0 || (l.autor||"").toLowerCase().indexOf(b)>=0;
      var bateC = S.filtro==="Todos" || l.categoria===S.filtro;
      return bateB && bateC;
    });
    h=cabecalho("Acervo catalogado","home")+
      '<div class="campo"><input id="busca" placeholder="Buscar por título ou autor" value="'+esc(S.busca)+'" oninput="S.busca=this.value;desenhaLista()"></div>'+
      '<div class="chips">';
    for(var c=0;c<cats.length;c++){
      h+='<button class="chip'+(S.filtro===cats[c]?' ativo':'')+'" onclick="S.filtro=\''+cats[c]+'\';render()">'+cats[c]+'</button>';}
    h+='</div><p style="font-size:12px;font-weight:600;color:var(--tinta-suave);margin-bottom:12px">'+
      lista.length+' de '+S.livros.length+' livros</p><div id="lista">'+
      (lista.length?lista.map(function(l){return cardLivro(l,false);}).join(""):'<div class="vazio">Nenhum livro encontrado.</div>')+
      '</div>';
  }

  else if(S.tela==="painel"){
    h=cabecalho("Painel da coordenação","home");
    var pa=pendAbertas();
    h+='<div class="secao-tit">Pendências ('+pa.length+')</div>';
    if(!pa.length)h+='<p style="font-size:14px;color:var(--tinta-suave)">Nenhuma pendência no momento.</p>';
    for(var i=0;i<pa.length;i++){
      var p=pa[i], lv=null, rl=null;
      for(var x=0;x<S.livros.length;x++){if(S.livros[x].id===p.livro)lv=S.livros[x];if(S.livros[x].id===p.rel)rl=S.livros[x];}
      var rot={duplicata:"Exemplar duplicado",colecao:"Possível mesma coleção",duvida:"Dúvida de categoria"}[p.tipo];
      var difere = rl && lv && rl.armario!==lv.armario;
      h+='<div class="aviso aviso-amarelo"><b style="font-size:12px">'+rot+'</b>'+
        '<div style="font-weight:600;margin-top:4px">'+esc(lv?lv.titulo:"—")+'</div>'+
        '<div style="font-size:12px;color:var(--tinta-suave)">Armário '+esc(lv?lv.armario:"—")+
        (p.tipo==="duvida"&&lv?' · catalogado como '+esc(lv.categoria):'')+'</div>'+
        (rl?'<div style="font-size:12px;color:var(--tinta-suave);margin-top:4px">com: '+esc(rl.titulo)+
            '<br><b style="color:'+(difere?'var(--coral)':'var(--tinta-suave)')+'">Armário '+esc(rl.armario)+
            (difere?' — armários diferentes, confira antes de unir':'')+'</b></div>':'')+
        '<button class="btn btn-escuro" style="margin-top:10px;padding:10px;font-size:13px" onclick="resolver(\''+p.id+'\')">'+
        (p.tipo==="duvida"?"Marcar como revisado":"Confirmar união física")+'</button></div>';
    }
    var mapa={};
    S.livros.forEach(function(l){if(!mapa[l.rm])mapa[l.rm]={nome:l.nome,rm:l.rm,total:0};mapa[l.rm].total++;});
    var rank=Object.keys(mapa).map(function(k){return mapa[k];}).sort(function(a,b){return b.total-a.total;});
    h+='<div class="secao-tit">Ranking de catalogação</div>';
    if(!rank.length)h+='<p style="font-size:14px;color:var(--tinta-suave)">Ninguém catalogou ainda.</p>';
    for(var r=0;r<rank.length;r++){
      h+='<button class="linha" onclick="verHistorico(\''+rank[r].rm+'\')"><span>'+(r+1)+'. '+esc(rank[r].nome)+'</span>'+
        '<span>'+rank[r].total+' &#8250;</span></button>';
    }
    h+='<div class="secao-tit">Entradas de hoje</div>';
    if(!S.logins.length)h+='<p style="font-size:14px;color:var(--tinta-suave)">Ninguém entrou ainda.</p>';
    for(var g=0;g<S.logins.length;g++){
      h+='<div class="linha"><span>'+esc(S.logins[g].nome)+' <span style="font-weight:400;color:var(--tinta-suave)">· RM '+esc(S.logins[g].rm)+'</span></span>'+
        '<span style="font-weight:600;color:var(--tinta-suave)">'+esc(S.logins[g].hora)+'</span></div>';
    }
    h+='<div style="margin-top:24px"><button class="btn btn-vazado" onclick="cadastroManual()">Cadastrar livro manualmente</button></div>';
  }

  document.getElementById("app").innerHTML=h;
}

function desenhaLista(){
  var b=S.busca.toLowerCase();
  var lista=S.livros.filter(function(l){
    var bateB=!b||(l.titulo||"").toLowerCase().indexOf(b)>=0||(l.autor||"").toLowerCase().indexOf(b)>=0;
    var bateC=S.filtro==="Todos"||l.categoria===S.filtro;
    return bateB&&bateC;});
  var el=document.getElementById("lista");
  if(el)el.innerHTML=lista.length?lista.map(function(l){return cardLivro(l,false);}).join(""):'<div class="vazio">Nenhum livro encontrado.</div>';
}

carregar();
render();
</script>
</body>
</html>
