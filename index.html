<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo da Biblioteca — Grêmio Estudantil Máxima</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --amarelo:#FFC933; --amarelo-esc:#F0AE00;
  --azul:#16305C; --azul-med:#24478A; --azul-claro:#EAF0FA;
  --tinta:#1B2340; --tinta-suave:#5A6480;
  --creme:#FFFDF6; --card:#FFFFFF; --borda:#E4E8F2;
  --verde:#2FAE72; --coral:#FF6B4A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--creme);font-family:'Inter',sans-serif;color:var(--tinta)}
#app{max-width:480px;margin:0 auto;padding:24px 20px 40px;min-height:100vh}
h1,h2,.display{font-family:'Baloo 2',sans-serif;margin:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:82vh;text-align:center}
.logo{width:130px;height:130px;object-fit:contain;margin-bottom:14px}
.logo-sm{width:48px;height:48px;object-fit:contain;border-radius:50%}
label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--tinta-suave);margin:0 0 6px}
input,select,textarea{width:100%;padding:13px 15px;font-size:16px;font-family:'Inter',sans-serif;border:2px solid var(--borda);border-radius:12px;background:#fff;outline:none;color:var(--tinta)}
input:focus,select:focus,textarea:focus{border-color:var(--azul-med)}
.campo{margin-bottom:16px;text-align:left}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;font-size:16px;font-weight:700;border-radius:16px;background:var(--amarelo);color:var(--azul)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-escuro{background:var(--azul);color:var(--amarelo)}
.btn-vazado{background:#fff;color:var(--azul);border:2px solid var(--azul-med)}
.btn-coral{background:var(--coral);color:#fff}
.link{display:block;width:100%;background:none;font-size:13px;font-weight:600;color:var(--azul-med);text-decoration:underline;margin-top:14px;padding:6px}
.card{background:var(--card);border:2px solid var(--borda);border-radius:20px;padding:20px;margin-bottom:12px;width:100%;text-align:left;display:block}
.card-amarelo{background:var(--amarelo);border-color:var(--amarelo-esc)}
.card-azul{background:var(--azul);border-color:var(--azul);color:var(--amarelo)}
.card h2{font-size:18px;margin:8px 0 2px;color:var(--azul)}
.card-amarelo h2{color:var(--azul)}
.card-azul h2{color:var(--amarelo)}
.card p{margin:0;font-size:13px;color:var(--tinta-suave)}
.card-amarelo p{color:rgba(22,48,92,.8)}
.card-azul p{color:#B9C7E0}
.topo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.topo h1{font-size:21px;flex:1;color:var(--azul)}
.voltar{background:#fff;border:1.5px solid var(--borda);border-radius:50%;width:38px;height:38px;font-size:20px;line-height:1;color:var(--azul)}
.selo-btn{width:100%;padding:15px;margin-bottom:8px;text-align:left;font-size:15px;font-weight:700;border-radius:12px;background:#fff;border:2px solid var(--borda);color:var(--tinta)}
.selo-btn.ativo{background:var(--azul);border-color:var(--azul);color:var(--amarelo)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--azul-claro);color:var(--azul);margin-right:6px}
.tag-azul{background:var(--azul);color:var(--amarelo)}
.tag-amarela{background:var(--amarelo);color:var(--azul)}
.aviso{border-radius:16px;padding:14px;margin-bottom:18px;font-size:14px;font-weight:500;line-height:1.5}
.aviso-coral{background:#FFE9E1;border:1.5px solid var(--coral)}
.aviso-amarelo{background:#FFF6DE;border:1.5px solid var(--amarelo-esc)}
.aviso-azul{background:var(--azul-claro);border:1.5px solid var(--azul-med)}
.livro{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--borda);border-radius:16px;padding:12px;margin-bottom:10px}
.capa{width:52px;height:74px;object-fit:cover;border-radius:8px;flex-shrink:0;background:var(--azul-claro)}
.livro-info{flex:1;min-width:0}
.livro-info .t{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;line-height:1.2;color:var(--azul);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.livro-info .a{font-size:12px;color:var(--tinta-suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icone-btn{background:var(--azul-claro);border:1.5px solid var(--borda);border-radius:50%;width:36px;height:36px;flex-shrink:0;font-size:15px;color:var(--azul)}
.lixeira{background:#FFE9E1;border-color:#FFC7B7;color:var(--coral)}
.linha{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1.5px solid var(--borda);border-radius:12px;padding:11px 14px;margin-bottom:6px;width:100%;font-size:14px;font-weight:600;text-align:left;color:var(--tinta)}
.secao-tit{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--azul-med);margin:26px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.chip{flex-shrink:0;font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--borda);color:var(--tinta-suave)}
.chip.ativo{background:var(--azul);border-color:var(--azul);color:var(--amarelo)}
.erro{color:var(--coral);font-size:13px;font-weight:600;margin:-8px 0 12px;text-align:left}
.contagem{display:flex;justify-content:space-between;align-items:center;background:var(--azul);border-radius:16px;padding:14px 18px;margin-bottom:22px}
.contagem span{color:#B9C7E0;font-weight:600;font-size:14px}
.contagem b{color:var(--amarelo);font-family:'Baloo 2',sans-serif;font-size:22px}
#leitor{width:100%;border-radius:20px;overflow:hidden;background:var(--azul);margin-bottom:14px}
.visor{position:relative}
.flash-btn{position:absolute;top:12px;right:12px;z-index:5;width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.92);border:2px solid rgba(22,48,92,.15);font-size:21px;line-height:1;
  display:none;align-items:center;justify-content:center;color:var(--azul)}
.flash-btn.ativo{background:var(--amarelo);border-color:var(--amarelo-esc)}
.vazio{text-align:center;color:var(--tinta-suave);font-size:14px;padding:32px 0}
.check{display:flex;align-items:center;gap:9px;margin:-6px 0 16px;font-size:13px;font-weight:600;color:var(--tinta-suave);text-align:left}
.check input{width:18px;height:18px;flex-shrink:0}
.ok{width:72px;height:72px;border-radius:50%;background:var(--verde);color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.rodape{text-align:center;font-size:11px;color:var(--tinta-suave);margin-top:28px;padding-top:16px;border-top:1px solid var(--borda)}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ CONFIGURAÇÃO — ajuste aqui antes do mutirão ============ */

/* --- BANCO DE DADOS (Supabase) --- */
var SUPABASE_URL = "https://xfudhlxmexedxwvzujae.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmdWRobHhtZXhlZHh3dnp1amFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MzMyMTksImV4cCI6MjEwMDUwOTIxOX0.Xahwaf8CS5IJYODq_ocsvZ38FLC7uTZO3eAiNzBfFzQ";
/* Enquanto a chave não for colada, o site funciona guardando os dados
   apenas no próprio celular. Com a chave, todos passam a ver o mesmo acervo. */

var LOGO = "chapamaximapreto.jpg";
var RM_DIGITOS = 5;
var COORDENADORAS = ["11111", "22222", "33333"];
/* Maíra = 11111 · Ana Clara = 22222 · Melissa = 33333 */
var ARMARIOS = [
  {codigo:"A1", categoria:"Literatura"},
  {codigo:"A2", categoria:"Paradidáticos"},
  {codigo:"B1", categoria:"PNLD"},
  {codigo:"B2", categoria:"Dicionários"},
  {codigo:"C1", categoria:"Vestibulares"},
  {codigo:"C2", categoria:"Coleções"},
  {codigo:"D1", categoria:"Revistas"},
  {codigo:"D2", categoria:"Outros gêneros"}
];
var GENEROS = ["Literatura","Paradidáticos","Dicionários","Vestibulares","Coleções","Revistas","Outros gêneros"];
var ESTADOS = ["Excelente","Bom","Regular","Ruim","Necessita reparo"];
var SELOS = ["PNLD","Acervo da Biblioteca","Comum"];
var COLECOES = [
  {id:"folclore", nome:"Folclore Brasileiro", chave:"folclore brasileiro"},
  {id:"vagalume", nome:"Vaga-Lume", chave:"vaga-lume"}
];
/* ==================================================================== */

var S = {tela:"login", user:null, livros:[], pendencias:[], logins:[], form:{}, erro:"",
         busca:"", filtro:"Todos", editando:null, dup:null, msg:"", rmVisto:null, carregando:false, offline:false, ultimoIsbn:""};

/* ---------- BANCO DE DADOS ---------- */
var db = null;
try{
  if(typeof window.supabase!=="undefined" && SUPABASE_KEY.indexOf("COLE_AQUI")<0){
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
}catch(e){ db=null; }

function salvar(){
  try{
    localStorage.setItem("cat_livros", JSON.stringify(S.livros));
    localStorage.setItem("cat_pend", JSON.stringify(S.pendencias));
    localStorage.setItem("cat_logins", JSON.stringify(S.logins));
  }catch(e){}
}
function carregar(){
  try{
    S.livros = JSON.parse(localStorage.getItem("cat_livros")||"[]");
    S.pendencias = JSON.parse(localStorage.getItem("cat_pend")||"[]");
    S.logins = JSON.parse(localStorage.getItem("cat_logins")||"[]");
  }catch(e){ S.livros=[]; S.pendencias=[]; S.logins=[]; }
  /* mantém a sessão se o celular bloquear ou a página recarregar */
  try{
    var u=JSON.parse(localStorage.getItem("cat_user")||"null");
    if(u&&u.rm&&u.nome){ S.user=u; S.tela="home"; }
  }catch(e){}
}

/* ---------- FILA DE ENVIO ----------
   Todo cadastro entra numa fila gravada no celular antes de ir ao banco.
   Se a internet cair, ele fica guardado e é reenviado sozinho quando voltar. */
function fila(){
  try{ return JSON.parse(localStorage.getItem("cat_fila")||"[]"); }catch(e){ return []; }
}
function gravarFila(f){
  try{ localStorage.setItem("cat_fila", JSON.stringify(f)); }catch(e){}
}
function enfileirar(tipo,dado){
  var f=fila(); f.push({tipo:tipo,dado:dado}); gravarFila(f);
}
var enviando=false;
function processarFila(){
  if(!db||enviando)return;
  var f=fila();
  if(!f.length){
    if(S.offline){S.offline=false;render();}
    return;
  }
  enviando=true;
  var item=f[0];
  var op = item.tipo==="livro"     ? db.from("livros").upsert(item.dado)
         : item.tipo==="pendencia" ? db.from("pendencias").upsert(item.dado)
         :                           db.from("logins").insert(item.dado);
  op.then(function(r){
    enviando=false;
    if(r&&r.error){ S.offline=true; render(); return; }
    var g=fila(); g.shift(); gravarFila(g);
    processarFila();
  }).catch(function(){
    enviando=false; S.offline=true; render();
  });
}
function enviarLivro(l){ enfileirar("livro",l); processarFila(); }
function enviarPendencia(p){ enfileirar("pendencia",p); processarFila(); }
function enviarLogin(x){ enfileirar("login",x); processarFila(); }

/* ---------- LEITURA DO BANCO ----------
   Só rebaixa o catálogo a cada 15 segundos, para não puxar milhares
   de livros a cada toque de botão. */
var ultimaSync=0;
function baixarTudo(forcar){
  if(!db)return;
  var agora=Date.now();
  if(!forcar && agora-ultimaSync<15000) return;
  ultimaSync=agora;

  db.from("livros").select("*").order("criado_em",{ascending:false}).then(function(r){
    if(r.error){ S.offline=true; render(); return; }
    var vindos=r.data||[];
    /* mantém na tela os livros que ainda não subiram, para nada sumir */
    var temId={}; vindos.forEach(function(l){temId[l.id]=true;});
    fila().forEach(function(item){
      if(item.tipo==="livro" && !temId[item.dado.id]) vindos.unshift(item.dado);
    });
    S.livros=vindos; salvar(); render();
  });
  db.from("pendencias").select("*").then(function(r){
    if(!r.error){S.pendencias=r.data||[];salvar();render();}
  });
  db.from("logins").select("*").order("criado_em",{ascending:false}).limit(60).then(function(r){
    if(!r.error){S.logins=r.data||[];render();}
  });
}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function armarioDe(cat){for(var i=0;i<ARMARIOS.length;i++){if(ARMARIOS[i].categoria===cat)return ARMARIOS[i];}return null;}
function formVazio(){return {titulo:"",autor:"",editora:"",ano:"",isbn:null,capa:null,selo:"",categoria:"",duvida:false,estado:"",qtd:1,obs:"",autoPreenchido:false};}
function meusLivros(){return S.livros.filter(function(l){return l.rm===S.user.rm;});}
function pendAbertas(){return S.pendencias.filter(function(p){return !p.ok;});}
function ir(t){
  S.tela=t;S.erro="";render();
  if(t==="acervo"||t==="painel")baixarTudo(true);
  else if(t==="home"||t==="historico")baixarTudo(false);
}

/* ---------- LOGIN ---------- */
function entrar(){
  var nome=(document.getElementById("nome").value||"").trim();
  var rm=(document.getElementById("rm").value||"").trim();
  if(nome.length<2){S.erro="Digite seu nome completo.";return render();}
  if(!/^[0-9]+$/.test(rm)||rm.length!==RM_DIGITOS){
    S.erro="Digite somente os números do seu RM ("+RM_DIGITOS+" dígitos).";return render();}
  var papel = COORDENADORAS.indexOf(rm)>=0 ? "coordenador" : "voluntario";
  S.user={nome:nome, rm:rm, papel:papel};
  try{ localStorage.setItem("cat_user", JSON.stringify(S.user)); }catch(e){}
  var reg={nome:nome, rm:rm, papel:papel,
    hora:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};
  S.logins.unshift(reg);
  enviarLogin(reg);
  salvar(); ir("home");
}

/* ---------- ISBN ---------- */
var leitor=null;
var flashLigado=false;

function trilhaVideo(){
  var v=document.querySelector("#leitor video");
  if(!v||!v.srcObject)return null;
  var t=v.srcObject.getVideoTracks();
  return (t&&t.length)?t[0]:null;
}
function checarFlash(){
  var b=document.getElementById("flash");
  if(!b)return;
  var t=trilhaVideo();
  if(!t||!t.getCapabilities)return;
  var cap={};
  try{ cap=t.getCapabilities()||{}; }catch(e){ return; }
  /* iPhone não expõe torch — o botão só aparece onde funciona de verdade */
  if(cap.torch)b.style.display="flex";
}
function alternarFlash(){
  var t=trilhaVideo();
  if(!t)return;
  flashLigado=!flashLigado;
  t.applyConstraints({advanced:[{torch:flashLigado}]})
    .then(function(){
      var b=document.getElementById("flash");
      if(b)b.className = flashLigado ? "flash-btn ativo" : "flash-btn";
      if(b)b.style.display="flex";
    })
    .catch(function(){
      flashLigado=false;
      alert("Este celular não permite ligar a lanterna pelo navegador.");
    });
}
function pararLeitor(){
  flashLigado=false;
  if(leitor){try{leitor.stop().catch(function(){});}catch(e){}leitor=null;}
}
function abrirCamera(){
  if(typeof Html5Qrcode==="undefined"){
    alert("O leitor de código não carregou. Verifique a internet ou digite o ISBN no campo abaixo.");return;}
  pararLeitor();
  leitor=new Html5Qrcode("leitor");
  leitor.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:140}},
    function(txt){pararLeitor();buscarIsbn(txt);},
    function(){}
  ).then(function(){
    setTimeout(checarFlash,700);
    setTimeout(checarFlash,1800);
  }).catch(function(){
    alert("Não foi possível abrir a câmera. Permita o acesso nas configurações do navegador ou digite o ISBN.");});
}
function buscarManual(){
  var v=(document.getElementById("isbnManual").value||"").replace(/[^0-9]/g,"");
  if(v.length<10){alert("Digite o ISBN completo (10 ou 13 números).");return;}
  buscarIsbn(v);
}
function capitalizar(s){
  if(!s)return "";
  if(s!==s.toUpperCase())return s;
  return s.toLowerCase().replace(/(^|\s|['\u2019-])\S/g,function(c){return c.toUpperCase();});
}
function capaReserva(isbn){
  return "https://covers.openlibrary.org/b/isbn/"+isbn+"-M.jpg?default=false";
}
function aplicarDados(isbn,dados){
  S.carregando=false;
  S.form=formVazio(); S.form.isbn=isbn;
  S.form.titulo=capitalizar(dados.titulo||"");
  S.form.autor=capitalizar(dados.autor||"");
  S.form.editora=capitalizar(dados.editora||"");
  S.form.ano=dados.ano||"";
  S.form.capa=dados.capa||null;
  S.form.autoPreenchido=true;
  ir("formulario");
}
function buscarIsbn(isbn){
  isbn=String(isbn).replace(/[^0-9Xx]/g,"");
  var existente=null;
  for(var i=0;i<S.livros.length;i++){if(S.livros[i].isbn===isbn){existente=S.livros[i];break;}}
  if(existente){S.dup=existente;return ir("duplicado");}
  S.carregando=true;S.ultimoIsbn=isbn;render();
  buscarBrasilAPI(isbn);
}

/* 1a fonte: BrasilAPI — reúne CBL, Mercado Editorial, Open Library e Google Books */
function buscarBrasilAPI(isbn){
  fetch("https://brasilapi.com.br/api/isbn/v1/"+isbn)
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(d){
      if(d&&d.title){
        var t=d.title;
        if(d.subtitle)t+=" — "+d.subtitle;
        return aplicarDados(isbn,{
          titulo:t,
          autor:(d.authors||[]).join(", "),
          editora:d.publisher||"",
          ano:d.year?String(d.year):"",
          capa:d.cover_url||capaReserva(isbn)
        });
      }
      buscarGoogle(isbn);
    })
    .catch(function(){ buscarGoogle(isbn); });
}

/* 2a fonte: Google Books — cobre bem edição estrangeira */
function buscarGoogle(isbn){
  fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:"+isbn)
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.items&&d.items.length){
        var v=d.items[0].volumeInfo||{};
        var t=v.title||"";
        if(v.subtitle)t+=" — "+v.subtitle;
        return aplicarDados(isbn,{
          titulo:t,
          autor:(v.authors||[]).join(", "),
          editora:v.publisher||"",
          ano:(v.publishedDate||"").substring(0,4),
          capa:(v.imageLinks&&v.imageLinks.thumbnail)?v.imageLinks.thumbnail.replace("http://","https://"):capaReserva(isbn)
        });
      }
      buscarOpenLibrary(isbn);
    })
    .catch(function(){ buscarOpenLibrary(isbn); });
}

/* 3a fonte: Open Library */
function buscarOpenLibrary(isbn){
  fetch("https://openlibrary.org/api/books?bibkeys=ISBN:"+isbn+"&format=json&jscmd=data")
    .then(function(r){return r.json();})
    .then(function(d){
      var k="ISBN:"+isbn, v=d[k];
      if(v&&v.title){
        var t=v.title;
        if(v.subtitle)t+=" — "+v.subtitle;
        return aplicarDados(isbn,{
          titulo:t,
          autor:(v.authors||[]).map(function(a){return a.name;}).join(", "),
          editora:(v.publishers||[]).map(function(p){return p.name;}).join(", "),
          ano:(v.publish_date||"").match(/\d{4}/)?(v.publish_date.match(/\d{4}/)[0]):"",
          capa:(v.cover&&(v.cover.medium||v.cover.large))?(v.cover.medium||v.cover.large):null
        });
      }
      S.carregando=false;S.form=formVazio();S.form.isbn=isbn;ir("naoAchou");
    })
    .catch(function(){
      S.carregando=false;S.form=formVazio();S.form.isbn=isbn;ir("naoAchou");});
}

/* ---------- FORMULÁRIO ---------- */
function lerForm(){
  var g=function(id){var e=document.getElementById(id);return e?e.value:null;};
  var t=g("f_titulo"); if(t!==null)S.form.titulo=t;
  var a=g("f_autor");  if(a!==null)S.form.autor=a;
  var c=g("f_cat");    if(c!==null)S.form.categoria=c;

function setSelo(s){lerForm();S.form.selo=s;render();}
function mudaQtd(n){lerForm();S.form.qtd=Math.max(1,(S.form.qtd||1)+n);render();}

function salvarLivro(){
  lerForm();
  var f=S.form;
  var cat = f.selo==="PNLD" ? "PNLD" : f.categoria;
  var arm = armarioDe(cat);
  var orig=null;
  if(S.editando){for(var i=0;i<S.livros.length;i++){if(S.livros[i].id===S.editando)orig=S.livros[i];}}
  var novo={
    id: S.editando || f.isbn || ("m"+Date.now()),
    isbn: f.isbn||null, titulo:f.titulo, autor:f.autor, editora:f.editora, ano:f.ano,
    capa:f.capa||null, selo:f.selo, categoria:cat, armario:arm?arm.codigo:"—",
    estado:f.estado, qtd:f.qtd||1, obs:f.obs,
    colecao: orig?orig.colecao:null,
    nome: orig?orig.nome:S.user.nome,
    rm: orig?orig.rm:S.user.rm,
    em: orig?orig.em:new Date().toLocaleString("pt-BR"),
    editadopor: orig?S.user.nome:null
  };
  if(S.editando){
    S.livros=S.livros.map(function(l){return l.id===S.editando?novo:l;});
    S.msg='"'+novo.titulo+'" foi atualizado.';
  }else{
    S.livros.unshift(novo);
    S.msg='"'+novo.titulo+'" foi catalogado no Armário '+novo.armario+'.';
    var col=null, tl=(novo.titulo||"").toLowerCase();
    for(var j=0;j<COLECOES.length;j++){if(tl.indexOf(COLECOES[j].chave)>=0)col=COLECOES[j];}
    if(col){
      var irmao=null;
      for(var k=0;k<S.livros.length;k++){
        if(S.livros[k].id!==novo.id && (S.livros[k].titulo||"").toLowerCase().indexOf(col.chave)>=0){irmao=S.livros[k];break;}}
      if(irmao){
        var pc={id:"p"+Date.now(),tipo:"colecao",livro:novo.id,rel:irmao.id,ok:false};
        S.pendencias.unshift(pc); enviarPendencia(pc);
        S.msg+=' Pode ser da mesma coleção de "'+irmao.titulo+'" — chame uma coordenadora.';
      }
    }
    if(f.duvida){
      var pd={id:"pd"+Date.now(),tipo:"duvida",livro:novo.id,rel:null,ok:false};
      S.pendencias.unshift(pd); enviarPendencia(pd);
      S.msg+=" A categoria ficou marcada para revisão.";
    }
  }
  enviarLivro(novo);
  S.editando=null;S.form=formVazio();salvar();ir("confirmado");
}
function editar(id){
  var l=null;for(var i=0;i<S.livros.length;i++){if(S.livros[i].id===id)l=S.livros[i];}
  if(!l)return;
  S.editando=id;
  S.form={titulo:l.titulo,autor:l.autor,editora:l.editora,ano:l.ano,isbn:l.isbn,capa:l.capa,
          selo:l.selo||"Acervo da Biblioteca",categoria:l.categoria,duvida:false,
          estado:l.estado,qtd:l.qtd,obs:l.obs,autoPreenchido:!!l.capa};
  ir("formulario");
}
function avisarCoord(){
  if(!S.dup)return ir("scan");
  var p={id:"p"+Date.now(),tipo:"duplicata",livro:S.dup.id,rel:null,ok:false};
  S.pendencias.unshift(p); enviarPendencia(p);
  S.msg='Aviso enviado. A coordenação vai unir este exemplar com "'+S.dup.titulo+'".';
  S.dup=null;salvar();ir("confirmado");
}
function resolver(pid){
  var p=null;for(var i=0;i<S.pendencias.length;i++){if(S.pendencias[i].id===pid)p=S.pendencias[i];}
  if(!p)return;
  if(p.tipo==="duplicata"){
    S.livros=S.livros.map(function(l){
      if(l.id===p.livro){var n=Object.assign({},l,{qtd:(l.qtd||1)+1});enviarLivro(n);return n;}
      return l;});
  }else if(p.tipo==="colecao"){
    var cid="c"+Date.now();
    S.livros=S.livros.map(function(l){
      if(l.id===p.livro||l.id===p.rel){var n=Object.assign({},l,{colecao:cid});enviarLivro(n);return n;}
      return l;});
  }
  p.ok=true; enviarPendencia(p); salvar(); render();
}
function apagar(id){
  if(!S.user||S.user.papel!=="coordenador")return;
  var l=null;
  for(var i=0;i<S.livros.length;i++){if(S.livros[i].id===id)l=S.livros[i];}
  if(!l)return;
  if(!confirm('Apagar "'+l.titulo+'" do catálogo?\n\nEsta ação não pode ser desfeita.'))return;
  S.livros=S.livros.filter(function(x){return x.id!==id;});
  S.pendencias=S.pendencias.filter(function(p){return p.livro!==id && p.rel!==id;});
  if(db){
    db.from("livros").delete().eq("id",id).then(function(){});
    db.from("pendencias").delete().or("livro.eq."+id+",rel.eq."+id).then(function(){});
  }
  salvar();render();
}
function zerarTudo(){
  if(!S.user||S.user.papel!=="coordenador")return;
  if(!confirm("Isto apaga TODOS os livros, pendências e entradas do catálogo.\n\nUse somente para limpar os testes antes do mutirão começar."))return;
  if(!confirm("Tem certeza? Não dá para desfazer."))return;
  S.livros=[];S.pendencias=[];S.logins=[];
  gravarFila([]);
  if(db){
    db.from("livros").delete().neq("id","").then(function(){});
    db.from("pendencias").delete().neq("id","").then(function(){});
    db.from("logins").delete().gt("id",0).then(function(){});
  }
  salvar();render();
}
function cadastroManual(){S.editando=null;S.form=formVazio();ir("formulario");}
function verHistorico(rm){S.rmVisto=rm;ir("histPessoa");}
function sair(){
  pararLeitor();
  try{ localStorage.removeItem("cat_user"); }catch(e){}
  S.user=null;S.form=formVazio();S.editando=null;ir("login");
}

    }
    var mapa={};
    S.livros.forEach(function(l){if(!mapa[l.rm])mapa[l.rm]={nome:l.nome,rm:l.rm,total:0};mapa[l.rm].total++;});
    var rank=Object.keys(mapa).map(function(k){return mapa[k];}).sort(function(a,b){return b.total-a.total;});
    h+='<div class="secao-tit">Ranking de catalogação</div>';
    if(!rank.length)h+='<p style="font-size:14px;color:var(--tinta-suave)">Ninguém catalogou ainda.</p>';
    for(var r=0;r<rank.length;r++){
      h+='<button class="linha" onclick="verHistorico(\''+rank[r].rm+'\')"><span>'+(r+1)+'. '+esc(rank[r].nome)+'</span>'+
        '<span style="color:var(--azul-med)">'+rank[r].total+' &#8250;</span></button>';
    }
    h+='<div class="secao-tit">Entradas de hoje</div>';
    if(!S.logins.length)h+='<p style="font-size:14px;color:var(--tinta-suave)">Ninguém entrou ainda.</p>';
    for(var g=0;g<S.logins.length;g++){
      h+='<div class="linha"><span>'+esc(S.logins[g].nome)+' <span style="font-weight:400;color:var(--tinta-suave)">· RM '+esc(S.logins[g].rm)+'</span></span>'+
        '<span style="font-weight:600;color:var(--tinta-suave)">'+esc(S.logins[g].hora)+'</span></div>';
    }
    h+='<div style="margin-top:24px"><button class="btn btn-vazado" onclick="cadastroManual()">Cadastrar livro manualmente</button></div>'+
      '<div class="secao-tit" style="color:var(--coral)">Antes do mutirão começar</div>'+
      '<p style="font-size:13px;color:var(--tinta-suave);margin:0 0 10px">Use para limpar os livros de teste. Depois que o mutirão começar, não use.</p>'+
      '<button class="btn btn-coral" onclick="zerarTudo()">Zerar catálogo</button>'+rodape();
  }

  document.getElementById("app").innerHTML=h;
}

function filtrar(){
  var b=S.busca.toLowerCase();
  return S.livros.filter(function(l){
    var bateB=!b||(l.titulo||"").toLowerCase().indexOf(b)>=0||(l.autor||"").toLowerCase().indexOf(b)>=0;
    var bateC=S.filtro==="Todos"||l.categoria===S.filtro;
    return bateB&&bateC;});
}
function desenhaLista(){
  var lista=filtrar();
  var el=document.getElementById("lista");
  if(el)el.innerHTML=lista.length?lista.map(function(l){return cardLivro(l,S.user&&S.user.papel==="coordenador");}).join(""):'<div class="vazio">Nenhum livro encontrado.</div>';
  var ct=document.getElementById("contador");
  if(ct)ct.textContent=lista.length+" de "+S.livros.length+" livros";
}

carregar();
render();
if(S.user)baixarTudo(true);

/* tenta reenviar o que ficou na fila, sozinho */
setInterval(processarFila, 12000);
window.addEventListener("online", processarFila);
processarFila();
</script>
</body>
</html>
